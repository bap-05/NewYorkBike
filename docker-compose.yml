# Mỗi worker chạy theo lịch riêng và dùng MySQL/Aiven hiện có.
x-python: &python
  build:
    context: .
    dockerfile: services/Dockerfile
  image: newyorkbike-python:local
  env_file: .env
  volumes:
    - ./certs:/app/certs:ro
    - ./data:/app/data
    - ./artifacts:/app/artifacts
services:
  database-api:
    <<: *python
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/live', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    volumes:
      - ./certs:/app/certs:ro
      - ./artifacts:/app/artifacts:ro
      # EDA background generator publishes snapshots here; other artifacts stay read-only.
      - ./artifacts/eda:/app/artifacts/eda
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      database-api:
        condition: service_healthy
  data-ingestion:
    <<: *python
    environment:
      OUTBOUND_PROXY_ENABLED: ${DOCKER_INGESTION_USE_PROXY:-false}
    command: [python, -m, ingestion.main, --schedule, --interval-minutes, "5"]
  data-analysis:
    <<: *python
    command: [python, -m, analysis.main, --schedule]
  clustering:
    <<: *python
    command: [python, -m, clustering.main, --schedule]
  prediction:
    <<: *python
    command: [python, -m, prediction.main, --schedule]

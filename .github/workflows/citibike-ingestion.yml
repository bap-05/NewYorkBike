name: Citi Bike collection

on:
  workflow_dispatch:
  schedule:
    # UTC :00/:30 are also :00/:30 in New York in both EST and EDT.
    - cron: '0,30 * * * *'

permissions:
  contents: read

concurrency:
  group: citibike-ingestion
  cancel-in-progress: false

jobs:
  collect:
    # Start manually first. Setting this repository variable opts into scheduling.
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect once into Aiven
        id: collect
        env:
          PYTHONUNBUFFERED: '1'
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_CA_CERT: ${{ secrets.MYSQL_CA_CERT }}
          OUTBOUND_PROXY_ENABLED: ${{ vars.OUTBOUND_PROXY_ENABLED || 'true' }}
          OUTBOUND_PROXY_URLS: ${{ secrets.OUTBOUND_PROXY_URLS || '[]' }}
          STATION_IDS: ${{ vars.STATION_IDS }}
        run: python -m scripts.run_github_collection
      - name: Save Bronze outside the temporary runner
        if: always() && steps.collect.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: citibike-bronze-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/bronze/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false

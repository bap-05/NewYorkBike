name: Citi Bike analysis

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: citibike-analysis
  cancel-in-progress: false

jobs:
  analyze:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_ANALYSIS_SCHEDULE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Analyze Silver and publish Gold once
        env:
          PYTHONUNBUFFERED: '1'
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_CA_CERT: ${{ secrets.MYSQL_CA_CERT }}
          STATION_IDS: ${{ vars.STATION_IDS }}
          ANALYSIS_EXPECTED_INTERVAL_SECONDS: ${{ vars.ANALYSIS_EXPECTED_INTERVAL_SECONDS || '1800' }}
          ANALYSIS_WINDOW_DAYS: ${{ vars.ANALYSIS_WINDOW_DAYS || '7' }}
          ANALYSIS_LOW_BIKE_THRESHOLD: ${{ vars.ANALYSIS_LOW_BIKE_THRESHOLD || '3' }}
          ANALYSIS_MIN_SAMPLES: ${{ vars.ANALYSIS_MIN_SAMPLES || '2' }}
          ANALYSIS_MIN_COVERAGE: ${{ vars.ANALYSIS_MIN_COVERAGE || '0.8' }}
          ANALYSIS_INGESTION_GRACE_SECONDS: ${{ vars.ANALYSIS_INGESTION_GRACE_SECONDS || '120' }}
        run: python -m scripts.run_github_analysis

name: Citi Bike clustering

on:
  workflow_dispatch:
  schedule:
    # 07:00 UTC = 02:00 EST / 03:00 EDT. One NY calendar-day snapshot.
    # Alternatively use cron-job.org at 02:00 America/New_York via workflow_dispatch.
    - cron: '0 7 * * *'

permissions:
  contents: read

concurrency:
  group: citibike-clustering
  cancel-in-progress: false

jobs:
  cluster:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_CLUSTERING_SCHEDULE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-clustering.txt
      - run: python -m pip install -r requirements-clustering.txt
      - name: Cluster stations and publish one daily Gold snapshot
        env:
          PYTHONUNBUFFERED: '1'
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_CA_CERT: ${{ secrets.MYSQL_CA_CERT }}
          STATION_IDS: ${{ vars.STATION_IDS }}
          CLUSTERING_EXPECTED_INTERVAL_SECONDS: ${{ vars.CLUSTERING_EXPECTED_INTERVAL_SECONDS || '1800' }}
          CLUSTERING_WINDOW_DAYS: ${{ vars.CLUSTERING_WINDOW_DAYS || '7' }}
          CLUSTERING_MIN_SAMPLES: ${{ vars.CLUSTERING_MIN_SAMPLES || '200' }}
          CLUSTERING_MIN_DAILY_COVERAGE: ${{ vars.CLUSTERING_MIN_DAILY_COVERAGE || '0.8' }}
          CLUSTERING_MIN_STATIONS: ${{ vars.CLUSTERING_MIN_STATIONS || '6' }}
          CLUSTERING_MAX_CLUSTERS: ${{ vars.CLUSTERING_MAX_CLUSTERS || '4' }}
          CLUSTERING_LOW_BIKE_THRESHOLD: ${{ vars.CLUSTERING_LOW_BIKE_THRESHOLD || '3' }}
        run: python -m scripts.run_github_clustering
